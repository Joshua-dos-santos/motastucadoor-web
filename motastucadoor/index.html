<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const storageKey = "mota-theme";
          const storedTheme = localStorage.getItem(storageKey);
          const systemPrefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : systemPrefersDark
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta
      name="description"
      content="Mota Stucadoor verzorgt professioneel stuc- en pleisterwerk voor grote en kleine projecten in Valkenswaard en omgeving."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://motastucadoor.nl/" />
    <link rel="icon" type="image/svg+xml" href="/motastucadoor-logo.svg" />
    <meta property="og:title" content="Mota Stucadoor" />
    <meta
      property="og:description"
      content="Professioneel stuc- en pleisterwerk in Valkenswaard en omgeving."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://motastucadoor.nl/" />
    <meta property="og:site_name" content="Mota Stucadoor" />
    <meta property="og:locale" content="nl_NL" />

    <title>Mota Stucadoor</title>
  </head>

</html>
